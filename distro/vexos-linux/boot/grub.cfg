set timeout=3
set default=0

menuentry "VexOS Linux 1.0" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet loglevel=3
    initrd /boot/initrd.gz
}

menuentry "VexOS Linux 1.0 (verbose boot)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=7
    initrd /boot/initrd.gz
}
