# VexOS login screen: same wallpaper, theme, and icons as the desktop.
[greeter]
theme-name = Arc-Dark
icon-theme-name = Papirus-Dark
font-name = Inter 11
background = /usr/share/backgrounds/vexos/vexos-wallpaper.jpg
user-background = false
clock-format = %a %d %b  %H:%M
indicators = ~host;~spacer;~clock;~spacer;~session;~a11y;~power
position = 50%,center
