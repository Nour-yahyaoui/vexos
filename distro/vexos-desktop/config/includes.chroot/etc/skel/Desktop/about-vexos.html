<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>About VexOS Desktop</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0b0a0f;
      color: #f2e8ea;
      margin: 0;
      padding: 3em 1em;
      text-align: center;
    }
    img.logo { width: 180px; height: 180px; filter: drop-shadow(0 0 18px #ff1a1a); }
    h1 { color: #ff3b3b; letter-spacing: .08em; margin: .4em 0 .1em; }
    .tag { color: #9a8f93; margin-bottom: 2em; }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #17131a;
      border: 1px solid #3a1b1f;
      border-radius: 12px;
      padding: 1.5em;
      text-align: left;
    }
    .card dt { color: #ff3b3b; font-weight: bold; margin-top: .8em; }
    .card dd { margin: .2em 0 0 0; }
    a { color: #ff6b6b; }
    code { background: #241d24; padding: .1em .4em; border-radius: 4px; }
  </style>
</head>
<body>
  <img class="logo" src="file:///usr/share/pixmaps/vexos-logo.png" alt="VexOS logo">
  <h1>VexOS Desktop</h1>
  <div class="tag">Version 1.0 · Debian trixie based</div>

  <div class="card">
    <dl>
      <dt>Created by</dt>
      <dd>Nour-yahyaoui</dd>

      <dt>Project</dt>
      <dd>vexos</dd>

      <dt>Source code</dt>
      <dd><a href="https://github.com/Nour-yahyaoui/vexos">github.com/Nour-yahyaoui/vexos</a></dd>

      <dt>Built with</dt>
      <dd>Debian live-build, XFCE, Firefox ESR, Python 3, Node.js</dd>

      <dt>Tip</dt>
      <dd>Open a terminal and type <code>vexpad --help</code> for the editor guide.</dd>
    </dl>
  </div>
</body>
</html>
